services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-finance_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-finance_ai}
      DEBUG: ${DEBUG:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app

  telegram:
    build: ./backend
    env_file: .env
    command: python -m app.telegram_bot
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./backend:/app

  frontend:
    restart: unless-stopped
    build: ./frontend
    command: sh -c "npm run build && npm run start"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app          # live source mount — changes propagate without rebuild
      - /app/.next               # isolate .next inside container (never from host)
      - /app/node_modules        # isolate node_modules inside container

  miniapp-gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    profiles: [miniapp]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/miniapp.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: [miniapp]
    command: tunnel --no-autoupdate --protocol http2 --url http://miniapp-gateway:8080
    depends_on:
      - miniapp-gateway

volumes:
  postgres_data:
