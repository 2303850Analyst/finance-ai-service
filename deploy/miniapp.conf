server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=10s;
    set $frontend_service frontend:3000;
    set $backend_service backend:8000;
    client_max_body_size 7m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://t.me" always;
    access_log off;

    location = / { return 302 /miniapp; }
    location = /miniapp {
        limit_except GET { deny all; }
        proxy_pass http://$frontend_service;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location /_next/static/ {
        limit_except GET { deny all; }
        proxy_pass http://$frontend_service;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location /miniapp-assets/ {
        limit_except GET { deny all; }
        proxy_pass http://$frontend_service;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location ~ "^/api/v1/miniapp/(bootstrap|accounts|overview|history|drafts(/parse|/[a-fA-F0-9-]{36}(/decide)?)?|query|reports)$" {
        proxy_pass http://$backend_service;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Telegram-Secret "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    location / { return 404; }
}
